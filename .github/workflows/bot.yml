name: dafeiyu-bot
on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Run bot
        run: timeout 330m python qq_bot.py

      - name: Save memory
        run: |
          git config user.name "dafeiyu-bot"
          git config user.email "dafeiyu@bot.com"
          git add memory.json
          git commit -m "auto-save memory" || echo "no changes"
          git push
